<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>LSPD Standard Operating Procedures</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101827; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    .fallback { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; padding: 24px; color: #fff; font: 16px Arial, sans-serif; text-align: center; background: #101827; }
    .fallback a { color: #9fc5ff; }
  </style>
</head>
<body>
  <iframe
    src="https://lspd-government.github.io/LSPD-SOP-Handbook/"
    title="LSPD SOP Handbook"
    allow="fullscreen"
    onerror="document.getElementById('fallback').hidden = false">
  </iframe>
  <div class="fallback" id="fallback" hidden>
    <strong>Unable to display the SOP Handbook here.</strong>
    <a href="https://lspd-government.github.io/LSPD-SOP-Handbook/">Open the SOP Handbook directly</a>
  </div>
</body>
</html>
